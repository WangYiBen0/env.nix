name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Determinate Nix tries to log in to FlakeHub when id-token: write is
          # set; this repo publishes nowhere, so stay on vanilla Nix.
          determinate: false
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Check
        # Only the host system; building other systems is wasted on this runner.
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix flake check

  cache:
    needs: checks
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Determinate Nix tries to log in to FlakeHub when id-token: write is
          # set; this repo publishes nowhere, so stay on vanilla Nix.
          determinate: false
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Fetch base commit for diff
        if: github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

      - name: Build changed packages and push to Cachix
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail

          # If shared/global inputs changed, rebuild everything.
          # (The `*` glob in installables is unsupported here, so enumerate
          #  package attribute names explicitly.)
          build_all() {
            echo "==> Global inputs changed, building all packages"
            mapfile -t all_pkgs < <(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json | sed -e 's/\[//' -e 's/\]//' -e 's/,/\n/g' -e 's/"//g' -e 's/ //g')
            for p in "${all_pkgs[@]}"; do
              echo ".#packages.x86_64-linux.$p"
            done
          }

          # Dispatched runs (Update pkgs pushes a flake.lock bump and a
          # package-update commit; diffing parent..head would miss the lock
          # bump entirely) have no before-ref — rebuild everything.
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            mapfile -t build_list < <(build_all)
          else
            changed="$(git diff --name-only "$before" "${{ github.sha }}")"
            echo "Changed files:"
            echo "$changed"

            build_list=()
            if echo "$changed" | grep -qE '^(flake\.nix|flake\.lock|outputs/|overlays/|lib/|modules/)'; then
              mapfile -t build_list < <(build_all)
            else
              for d in $(find pkgs -name package.nix -exec dirname {} \;); do
                if echo "$changed" | grep -qE "^${d}/"; then
                  build_list+=(".#packages.x86_64-linux.$(basename "$d")")
                fi
              done
            fi
          fi

          if [ ${#build_list[@]} -eq 0 ]; then
            echo "==> Nothing to build"
            exit 0
          fi

          echo "==> Building: ${build_list[*]}"
          # nix substitutes from Cachix/Magic Cache, so already-built paths are
          # not rebuilt; cachix push only uploads what is missing.
          nix build --no-link "${build_list[@]}"
          nix path-info "${build_list[@]}" | cachix push w1ngd1nga5ter
