name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "enabled"

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Check
        # Only the host system; building other systems is wasted on this runner.
        run: nix flake check

  cache:
    # Serialised after checks so the shared nixpkgs closure is realised once
    # (via Magic Nix Cache) instead of being built twice in parallel.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "enabled"

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Fetch base commit for diff
        if: github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

      - name: Build changed packages and push to Cachix
        run: |
          set -euo pipefail

          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${{ github.sha }}^"
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "Changed files:"
          echo "$changed"

          build_list=()

          # If shared/global inputs changed, rebuild everything.
          # (The `*` glob in installables is unsupported here, so enumerate
          #  package attribute names explicitly.)
          if echo "$changed" | grep -qE '^(flake\.nix|flake\.lock|outputs/|overlays/|lib/|modules/)'; then
            echo "==> Global inputs changed, building all packages"
            mapfile -t all_pkgs < <(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json | sed -e 's/\[//' -e 's/\]//' -e 's/,/\n/g' -e 's/"//g' -e 's/ //g')
            for p in "${all_pkgs[@]}"; do
              build_list+=(".#packages.x86_64-linux.$p")
            done
          else
            for d in $(find pkgs -name package.nix -exec dirname {} \;); do
              if echo "$changed" | grep -qE "^${d}/"; then
                build_list+=(".#packages.x86_64-linux.$(basename "$d")")
              fi
            done
          fi

          if [ ${#build_list[@]} -eq 0 ]; then
            echo "==> Nothing to build"
            exit 0
          fi

          echo "==> Building: ${build_list[*]}"
          # nix substitutes from Cachix/Magic Cache, so already-built paths are
          # not rebuilt; cachix push only uploads what is missing.
          nix build --no-link "${build_list[@]}"
          nix path-info "${build_list[@]}" | cachix push w1ngd1nga5ter
