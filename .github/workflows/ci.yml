name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Determinate Nix tries to log in to FlakeHub when id-token: write is
          # set; this repo publishes nowhere, so stay on vanilla Nix.
          determinate: false
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      # The full host closures push ~25 GB into /nix/store, which alone is
      # more than the runner's free disk; since the flake.lock nixpkgs bump
      # the closure step has been dying mid-download with the runner being
      # torn down (exit 143). Reclaim the preinstalled toolchains first.
      - name: Free runner disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift
          sudo docker image prune --force || true
          df -h /

      - name: Check
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: nix flake check

      # `nix flake check` only evaluates the configurations — a build failure
      # (stale hash, dead fetch) still passes. Build every system and home
      # closure for real.
      - name: Build system and home closures
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          parse() { sed -e 's/\[//' -e 's/\]//' -e 's/,/\n/g' -e 's/"//g' -e 's/ //g'; }
          installables=()
          mapfile -t hosts < <(nix eval .#nixosConfigurations --apply builtins.attrNames --json | parse)
          for h in "${hosts[@]}"; do
            installables+=(".#nixosConfigurations.$h.config.system.build.toplevel")
          done
          mapfile -t homes < <(nix eval .#homeConfigurations --apply builtins.attrNames --json | parse)
          for h in "${homes[@]}"; do
            installables+=(".#homeConfigurations.\"$h\".activationPackage")
          done
          echo "==> Building ${#installables[@]} closure(s)"
          : > "$RUNNER_TEMP/closure-outs.txt"
          # Build one closure at a time, keeping a gc root on each out path:
          # the combined closures push the runner's disk/RAM ceiling, and the
          # single-invocation build keeps getting the runner torn down
          # (exit 143) mid-copy since the last nixpkgs bump.
          i=0
          for installable in "${installables[@]}"; do
            i=$((i + 1))
            echo "==> [$i/${#installables[@]}] $installable"
            nix build --no-link --print-out-paths -o "$RUNNER_TEMP/gcroot-$i" "$installable" | tee -a "$RUNNER_TEMP/closure-outs.txt"
            df -h /
          done

      # Everything already served by a substituter is skipped; the rest
      # would have to be rebuilt on every machine and lands in Cachix.
      - name: Push closure paths missing from substituters
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          outs=$(cat "$RUNNER_TEMP/closure-outs.txt")
          nix path-info -r $outs | sort -u > "$RUNNER_TEMP/closure.txt"
          echo "==> Closure paths: $(wc -l < "$RUNNER_TEMP/closure.txt")"

          substituters="https://cache.nixos.org https://niri.cachix.org https://nix-community.cachix.org https://catppuccin.cachix.org https://nixpkgs-python.cachix.org"
          check() {
            local p=$1
            for s in $substituters; do
              if nix path-info --store "$s" "$p" > /dev/null 2>&1; then
                return 0
              fi
            done
            return 1
          }
          export -f check
          export substituters
          xargs -P 16 -I{} bash -c 'check "$@"' _ < "$RUNNER_TEMP/closure.txt" > "$RUNNER_TEMP/missing.txt" || true
          echo "==> Missing from every substituter: $(wc -l < "$RUNNER_TEMP/missing.txt")"
          if [ -s "$RUNNER_TEMP/missing.txt" ]; then
            cachix push w1ngd1nga5ter < "$RUNNER_TEMP/missing.txt"
          fi

  cache:
    needs: checks
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Determinate Nix tries to log in to FlakeHub when id-token: write is
          # set; this repo publishes nowhere, so stay on vanilla Nix.
          determinate: false
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Fetch base commit for diff
        if: github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

      - name: Build changed packages and push to Cachix
        id: cache
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail

          # If shared/global inputs changed, rebuild everything.
          # (The `*` glob in installables is unsupported here, so enumerate
          #  package attribute names explicitly. The function's stdout is
          #  captured by mapfile — keep all human-readable echoes at the
          #  call sites, never inside it.)
          build_all() {
            mapfile -t all_pkgs < <(nix eval .#packages.x86_64-linux --apply builtins.attrNames --json | sed -e 's/\[//' -e 's/\]//' -e 's/,/\n/g' -e 's/"//g' -e 's/ //g')
            for p in "${all_pkgs[@]}"; do
              echo ".#packages.x86_64-linux.$p"
            done
          }

          # Dispatched runs (Update pkgs pushes a flake.lock bump and a
          # package-update commit; diffing parent..head would miss the lock
          # bump entirely) have no before-ref — rebuild everything.
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "==> Dispatched run, building all packages"
            mapfile -t build_list < <(build_all)
          else
            changed="$(git diff --name-only "$before" "${{ github.sha }}")"
            echo "Changed files:"
            echo "$changed"

            build_list=()
            if echo "$changed" | grep -qE '^(flake\.nix|flake\.lock|outputs/|overlays/|lib/|modules/)'; then
              echo "==> Global inputs changed, building all packages"
              mapfile -t build_list < <(build_all)
            else
              for d in $(find pkgs -name package.nix -exec dirname {} \;); do
                if echo "$changed" | grep -qE "^${d}/"; then
                  build_list+=(".#packages.x86_64-linux.$(basename "$d")")
                fi
              done
            fi
          fi

          # Defensive: only `.#...` installables may reach `nix build`. A stray
          # log line swallowed into build_list once did, and nix failed trying
          # to stat it as a path ("getting status of ...").
          filtered=()
          for installable in "${build_list[@]}"; do
            case "$installable" in
              .#*) filtered+=("$installable") ;;
              *) echo "::warning title=skipped non-installable::not an installable: $installable" ;;
            esac
          done
          build_list=("${filtered[@]}")

          if [ ${#build_list[@]} -eq 0 ]; then
            echo "==> Nothing to build"
            exit 0
          fi

          # Build each package independently: one broken package must not
          # strand the pushes of everything that did build (this is how niri
          # silently vanished from Cachix).
          ok=()
          failed=()
          for installable in "${build_list[@]}"; do
            p="${installable##*.}"
            echo "==> Building $p"
            if nix build --no-link "$installable"; then
              ok+=("$installable")
            else
              echo "::error title=nix build failed::nix build failed for $p"
              failed+=("$p")
            fi
          done

          if [ ${#ok[@]} -gt 0 ]; then
            echo "==> Pushing ${#ok[@]} package(s) to Cachix"
            nix path-info "${ok[@]}" | cachix push w1ngd1nga5ter
          else
            echo "==> Nothing built successfully"
          fi

          {
            echo "### Cachix push"
            if [ ${#ok[@]} -gt 0 ]; then
              echo "- pushed: ${#ok[@]} package(s)"
            fi
            if [ ${#failed[@]} -gt 0 ]; then
              echo "- failed: ${failed[*]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          printf "failed=%s\n" "${failed[*]:-}" >> "$GITHUB_OUTPUT"

      # Failing here — after the push — flags the broken packages without
      # stranding the ones that did build.
      - name: Fail on build errors
        if: steps.cache.outputs.failed != ''
        run: |
          echo "nix build failed for: ${{ steps.cache.outputs.failed }}"
          exit 1
