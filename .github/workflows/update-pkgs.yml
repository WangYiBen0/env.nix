name: Update pkgs

on:
  schedule:
    # Daily, 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: update-pkgs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Config git
        run: |
          git checkout -B ${{ github.ref_name }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Shared by the hash-repair and update steps: every package defined in
      # this flake together with its package.nix, one per line. Only packages
      # defined within this flake can be updated; packages exposed from
      # nixpkgs/other flakes are skipped.
      - name: Prepare package list
        run: |
          cat > "$RUNNER_TEMP/update-expr.nix" <<'EOF'
          let
            flake = builtins.getFlake (toString ./.);
            outPath = flake.outPath;
            pkgs = flake.packages.${builtins.currentSystem};
            srcFile = p:
              let
                pos = builtins.unsafeGetAttrPos "src" p;
              in
              if pos != null then pos.file else builtins.elemAt (builtins.match "(.*):([0-9]+)" p.meta.position) 0;
            isLocal = name:
              let
                file = srcFile pkgs.${name};
              in
              builtins.substring 0 (builtins.stringLength outPath) file == outPath;
            relFile = name:
              let
                file = srcFile pkgs.${name};
              in
              builtins.substring (builtins.stringLength outPath + 1) (builtins.stringLength file - builtins.stringLength outPath - 1) file;
          in
          builtins.concatStringsSep "\n" (
            builtins.map (name: "${name}	${relFile name}") (builtins.filter isLocal (builtins.attrNames pkgs))
          )
          EOF

      - name: Update flake inputs
        id: lock
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix flake update
          if ! git diff --quiet; then
            git add --all
            git commit --message "chore(flake): update flake.lock"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      # A nixpkgs bump can change a fetcher's output (cargo vendor layout,
      # pnpm store, ...) while upstream sources stay the same, which leaves
      # the hashes pinned in pkgs/ stale; CI would then fail with a hash
      # mismatch without any package actually changing. Rebuild every package
      # local to this flake and patch fixed-output mismatches in place, so the
      # CI triggered at the end of this workflow does not fail on them.
      - name: Repair fetch hashes
        if: steps.lock.outputs.updated == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          cat > "$RUNNER_TEMP/repair-hashes.sh" <<'EOF'
          set -euo pipefail
          packages=$(nix eval --raw --impure --expr "$(cat "$RUNNER_TEMP/update-expr.nix")")
          mapfile -t packages <<<"$packages"
          echo "Packages to check: ${packages[*]}"

          changed=()
          for entry in "${packages[@]}"; do
            read -r pkg file <<<"$entry"
            echo "==> Checking $pkg ($file)"
            errf=$(mktemp)
            # Fetches run before compilation, so a non-hash failure here means
            # every fixed-output of this package already verified.
            for _ in 1 2 3 4 5 6 7 8; do
              if nix build --no-link ".#packages.x86_64-linux.$pkg" 2>"$errf"; then
                break
              fi
              if ! grep -q "hash mismatch in fixed-output derivation" "$errf"; then
                echo "::warning::nix build failed for $pkg without a hash mismatch; leaving it to CI"
                cat "$errf"
                break
              fi
              specified=$(awk '/^[[:space:]]*specified:/{print $2; exit}' "$errf")
              got=$(awk '/^[[:space:]]*got:/{print $2; exit}' "$errf")
              if [[ "$specified" != sha256-* || "$got" != sha256-* ]]; then
                echo "::error::cannot parse the hash mismatch for $pkg; failing so it is not silently skipped"
                cat "$errf"
                rm -f "$errf"
                exit 1
              fi
              if ! grep -qF -- "$specified" "$file"; then
                echo "::error::$specified is not pinned in $file; cannot repair $pkg"
                rm -f "$errf"
                exit 1
              fi
              echo "    $specified -> $got"
              sed -i "s|$specified|$got|" "$file"
            done
            rm -f "$errf"
            if ! git diff --quiet -- "$file"; then
              changed+=("$pkg")
            fi
          done

          if [ ${#changed[@]} -gt 0 ]; then
            git add --all
            git commit --message "fix(pkgs): refresh fetch hashes for the new flake.lock (${changed[*]})"
          fi
          EOF

          nix develop --command bash "$RUNNER_TEMP/repair-hashes.sh"

      - name: Update pkgs
        id: pkgs
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          # honk's updateScript walks the GitHub API; an authenticated call
          # dodges the shared-runner IP rate limit.
          GH_TOKEN: ${{ github.token }}
        run: |
          # The package list is written by the "Prepare package list" step.
          # nix-update exits non-zero via an uncaught VersionError when the
          # newest release is unstable but --version=unstable is not requested;
          # treat that like "no update" instead of failing the run.
          # nix-update resolves the flake source through `nix flake metadata
          # --json`, whose reported store path is only materialized lazily by
          # the fetcher. On the installed upstream Nix nothing forces that
          # copy, so every eval nix-update runs AFTER the update script has
          # modified the tree dies with `opening file ...-source: No such file
          # or directory`. Drop the store-path indirection: eval.nix then
          # falls back to `builtins.getFlake <working tree>`, which fetches on
          # demand on every Nix (the update-expr.nix above already relies on
          # exactly that). All three call sites in nix-update handle `None`.
          cat > "$RUNNER_TEMP/nix-update-wrapper.py" <<'EOF'
          import sys

          from nix_update import main
          from nix_update.errors import VersionError
          from nix_update.options import Options

          Options.get_flake_import_path = lambda self: None

          try:
              main(sys.argv[1:])
          except VersionError as e:
              print(f"nix-update: {e}", file=sys.stderr)
              sys.exit(0)
          EOF

          # Materialize the flake source in the store: for a clean git tree
          # `nix flake metadata` reports a store path that is only materialized
          # lazily, and nix-update's eval dies with "opening file ...-source:
          # No such file or directory" when nothing forced the copy beforehand
          # (the dev shell used to do it as a side effect). Archiving also
          # warms every flake input for the per-package evals.
          for attempt in 1 2 3; do
            nix flake archive && break
            echo "nix flake archive attempt $attempt failed"
            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          # Resolve nix-update straight from the store and run the loop in a
          # plain bash: running it inside `nix develop` (dev shell + the
          # nested mkShell develops of every updateScript) made the flake
          # source store path vanish mid-run on runners — "opening file
          # ...-source: No such file or directory".
          nupath=$(nix build --no-link --print-out-paths nixpkgs#nix-update)
          nu_py=$(head -n1 "$nupath/bin/.nix-update-wrapped" | sed "s/^#!//")
          export nupath nu_py
          export PYTHONPATH="$(echo "$nupath"/lib/python*/site-packages)${PYTHONPATH:+:$PYTHONPATH}"

          bash -c '
            set -e
            packages=$(nix eval --raw --impure --expr "$(cat "$RUNNER_TEMP/update-expr.nix")")
            mapfile -t packages <<<"$packages"
            echo "Packages to update: ${packages[*]}"

            changed=()
            failed=()
            for entry in "${packages[@]}"; do
              read -r pkg file <<<"$entry"
              echo "==> Updating $pkg ($file)"
              # The git operations of this loop (add/checkout) re-key the
              # flake source store path; re-materialize it before every
              # package so the eval flakeImportPath always exists.
              nix flake archive --no-write-lock-file > /dev/null 2>&1 || true
              # Transient flake-input fetch failures (tarball resets, timeouts)
              # surface here as eval errors; retry a few times before giving
              # up on a package, undoing any partial rewrite between attempts.
              success=0
              for attempt in 1 2 3; do
                if "$nu_py" "$RUNNER_TEMP/nix-update-wrapper.py" --flake "$pkg" --override-filename "$file" --use-update-script; then
                  success=1
                  break
                fi
                echo "attempt $attempt/3 failed for $pkg"
                git checkout -- "$file" 2>/dev/null || true
                if [ "$attempt" -lt 3 ]; then
                  sleep 10
                fi
              done
              if [ "$success" != 1 ]; then
                # One broken package must not block the others or strand the
                # updates that did succeed: undo any partial rewrite, warn,
                # and keep going. The job is failed at the very end, after
                # the Push step has run.
                echo "::error title=nix-update failed::nix-update failed for $pkg"
                git checkout -- "$file" 2>/dev/null || true
                failed+=("$pkg")
              elif ! git diff --quiet; then
                changed+=("$pkg")
                git add --all
              fi
            done

            if [ ${#changed[@]} -gt 0 ]; then
              git commit --message "chore(pkgs): update ${changed[*]}"
            fi
            {
              echo "### Update pkgs"
              if [ ${#changed[@]} -gt 0 ]; then
                echo "- updated: ${changed[*]}"
              fi
              if [ ${#failed[@]} -gt 0 ]; then
                echo "- failed: ${failed[*]}"
              fi
              if [ ${#changed[@]} -eq 0 ] && [ ${#failed[@]} -eq 0 ]; then
                echo "- nothing to update"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            printf "updated=%s\nfailed=%s\n" "${changed[*]:-}" "${failed[*]:-}" >> "$GITHUB_OUTPUT"
          '

      - name: Generate GitHub App Token
        id: app-token
        if: steps.lock.outputs.updated == 'true' || steps.pkgs.outputs.updated != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # `main` is protected, so a push to it is rejected: the bot publishes its
      # work as a pull request and a human merges it.
      - name: Open a pull request
        id: pr
        if: steps.lock.outputs.updated == 'true' || steps.pkgs.outputs.updated != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch=bot/update-pkgs-${BASE_BRANCH}

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B "$branch"
          git push --force origin "$branch"

          if [ "$(gh pr list --head "$branch" --state open --json number --jq 'length')" = 0 ]; then
            cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Automated `flake.lock` and package updates from the `Update pkgs` workflow.

          Opened as a pull request because `main` no longer accepts direct pushes.
          CI is triggered by the push itself (the bot pushes with a GitHub App token),
          so no manual workflow dispatch is needed.
          EOF
            gh pr create --base $BASE_BRANCH --head "$branch" \
              --title "chore(${BASE_BRANCH}/pkgs): automated package and flake.lock updates" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          else
            echo "updated the existing pull request for $branch"
          fi

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Fail on update errors
        if: steps.pkgs.outputs.failed != ''
        run: |
          echo "nix-update failed for: ${{ steps.pkgs.outputs.failed }}"
          exit 1
