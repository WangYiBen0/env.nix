name: Update pkgs

on:
  schedule:
    # Daily, 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: update-pkgs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "enabled"

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Update flake inputs
        run: nix flake update

      - name: Update pkgs packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nix develop --command bash -c '
            set -e
            mapfile -t packages < <(find pkgs -name package.nix -exec dirname {} \; | xargs -n1 basename | sort -u)
            for pkg in "${packages[@]}"; do
              echo "==> Updating $pkg"
              if ! nix-update --flake "$pkg"; then
                echo "No update available for $pkg, skipping"
              fi
            done
          '

      - name: Format
        run: |
          nix develop --command bash -c '
            nixfmt $(git ls-files "*.nix"; git ls-files --others --exclude-standard "*.nix")
            prettier --ignore-unknown --write .
          '

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No updates found"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updates found:"
            git diff --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=$(git diff --name-only -- pkgs | xargs -n1 dirname | xargs -n1 basename | sort -u | paste -sd ' ' -)
          if [ -n "$changed" ]; then
            msg="chore(pkgs): update $changed"
          else
            msg="chore(flake): update flake.lock"
          fi
          git add -A
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin main
