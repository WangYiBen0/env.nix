name: Update pkgs

on:
  schedule:
    # Daily, 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: update-pkgs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes

      - name: Log in to FlakeHub
        run: /usr/local/bin/determinate-nixd login github-action

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: "enabled"

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: w1ngd1nga5ter
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community,catppuccin,niri,nixpkgs-python

      - name: Config git
        run: |
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        id: lock
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          nix flake update
          if ! git diff --quiet; then
            git add --all
            git commit --message "chore(flake): update flake.lock"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pkgs
        id: pkgs
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # Only update packages defined within this flake; packages exposed
          # from nixpkgs/other flakes cannot be updated by nix-update.
          cat > "$RUNNER_TEMP/update-expr.nix" <<'EOF'
          let
            flake = builtins.getFlake (toString ./.);
            outPath = flake.outPath;
            pkgs = flake.packages.${builtins.currentSystem};
            srcFile = p:
              let
                pos = builtins.unsafeGetAttrPos "src" p;
              in
              if pos != null then pos.file else builtins.elemAt (builtins.match "(.*):([0-9]+)" p.meta.position) 0;
            isLocal = name:
              let
                file = srcFile pkgs.${name};
              in
              builtins.substring 0 (builtins.stringLength outPath) file == outPath;
          in
          builtins.concatStringsSep "\n" (builtins.filter isLocal (builtins.attrNames pkgs))
          EOF

          # nix-update exits non-zero via an uncaught VersionError when the
          # newest release is unstable but --version=unstable is not requested;
          # treat that like "no update" instead of failing the run.
          cat > "$RUNNER_TEMP/nix-update-wrapper.py" <<'EOF'
          import sys

          from nix_update import main
          from nix_update.errors import VersionError

          try:
              main(sys.argv[1:])
          except VersionError as e:
              print(f"nix-update: {e}", file=sys.stderr)
              sys.exit(0)
          EOF

          nix develop --command bash -c '
            set -e
            packages=$(nix eval --raw --impure --expr "$(cat "$RUNNER_TEMP/update-expr.nix")")
            mapfile -t packages <<<"$packages"
            echo "Packages to update: ${packages[*]}"

            nu=$(command -v nix-update)
            bindir=$(dirname "$nu")
            appdir=$(dirname "$bindir")
            nu_py=$(head -n1 "$bindir/.nix-update-wrapped" | sed "s/^#!//")
            export PYTHONPATH="$(echo "$appdir"/lib/python*/site-packages)${PYTHONPATH:+:$PYTHONPATH}"

            flag=0
            changed=()
            for pkg in "${packages[@]}"; do
              echo "==> Updating $pkg"
              if ! "$nu_py" "$RUNNER_TEMP/nix-update-wrapper.py" --flake "$pkg" --use-update-script; then
                echo "error: nix-update failed for $pkg"
                flag=1
              elif ! git diff --quiet; then
                changed+=("$pkg")
                git add --all
              fi
            done

            if [ ${#changed[@]} -gt 0 ]; then
              git commit --message "chore(pkgs): update ${changed[*]}"
              printf "updated=true\nchanged=%s\n" "${changed[*]}" >> "$GITHUB_OUTPUT"
            else
              printf "updated=\n" >> "$GITHUB_OUTPUT"
            fi

            exit "$flag"
          '

      - name: Push
        id: push
        if: steps.lock.outputs.updated == 'true' || steps.pkgs.outputs.updated == 'true'
        run: |
          git pull --rebase origin main
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Commits pushed with GITHUB_TOKEN do not trigger other workflows,
      # so the CI cache job has to be dispatched explicitly.
      - name: Trigger CI cache
        if: steps.push.outputs.pushed == 'true'
        run: gh workflow run ci.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
